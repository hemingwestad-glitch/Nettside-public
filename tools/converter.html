<!DOCTYPE html>

<meta name="author" content="Heming Westad">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<meta property="og:title" content="Konverter — Heming Westad">

<meta property="og:image" content="https://hemingwestad.no/og-image.png">
<meta property="og:url" content="https://hemingwestad.no/tools/converter.html">

</head>
<body>
<header>
  <div class="logo"><a href="/">Heming Westad<span class="dot">.</span></a></div>
  <nav>
    <ul>
      <li><a href="/">heim</a></li>
      <li><a href="/tools.html" class="current">verktøy</a></li>
      <li><a href="/projects.html">prosjekter</a></li>
      <li><a href="/now.html">nå</a></li>
      <li><a href="/about.html">om</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="page-meta fade-up"><span>Konverterer</span></div>

  <h1 class="fade-up">Konverter <em>enheter</em>.</h1>
  <p class="lede fade-up">Frekvens og bølgelengde, dB-omregning, lengde, vinkel, energi.</p>

  <h2 class="section-header">Frekvens ↔ Bølgelengde</h2>
  <div class="panel">
    <div class="field-row">
      <div class="field">
        <label>Frekvens (MHz)</label>
        <input type="number" id="freq" value="437" step="0.1">
      </div>
      <div class="field">
        <label>Bølgelengde</label>
        <input type="text" id="wavelength" readonly>
      </div>
    </div>
    <div class="muted small" id="band-info"></div>
  </div>

  <h2 class="section-header">dB ↔ ratio</h2>
  <div class="panel">
    <div class="field-row">
      <div class="field">
        <label>dB</label>
        <input type="number" id="db" value="3" step="0.1">
      </div>
      <div class="field">
        <label>Effekt-ratio (×)</label>
        <input type="text" id="ratio" readonly>
      </div>
      <div class="field">
        <label>Spennings-ratio (×)</label>
        <input type="text" id="vratio" readonly>
      </div>
    </div>
  </div>

  <h2 class="section-header">Lengde</h2>
  <div class="panel">
    <div class="field-row">
      <div class="field"><label>Meter</label><input type="number" id="m" value="100" step="1"></div>
      <div class="field"><label>Fot</label><input type="number" id="ft" step="1"></div>
      <div class="field"><label>Yards</label><input type="number" id="yd" step="1"></div>
      <div class="field"><label>Sjømil</label><input type="number" id="nm" step="0.001"></div>
      <div class="field"><label>Mil (norsk)</label><input type="number" id="nmil" step="0.001"></div>
    </div>
  </div>

  <h2 class="section-header">Vinkel</h2>
  <div class="panel">
    <div class="field-row">
      <div class="field"><label>Grader</label><input type="number" id="deg" value="90" step="0.1"></div>
      <div class="field"><label>Radianer</label><input type="number" id="rad" step="0.001"></div>
      <div class="field"><label>Mil (NATO)</label><input type="number" id="mil" step="1"></div>
      <div class="field"><label>Bueminutt</label><input type="number" id="arcmin" step="1"></div>
    </div>
  </div>

  <h2 class="section-header">Energi</h2>
  <div class="panel">
    <div class="field-row">
      <div class="field"><label>Joule</label><input type="number" id="j" value="3000" step="10"></div>
      <div class="field"><label>kgm (kilogrammeter)</label><input type="number" id="kgm" step="0.1"></div>
      <div class="field"><label>foot-pounds</label><input type="number" id="ftlb" step="1"></div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-content">
    <div>© 2026 — Heming Westad</div>
    <div>Trondheim · <a href="https://github.com/hemingwestad-glitch/Nettside-public">kildekode</a></div>
  </div>
</footer>

<script src="/common.js"></script>
<script>
const $ = id => document.getElementById(id);

// Frekvens
function updateFreq() {
  const f = +$('freq').value;
  if (f > 0) {
    const lambda = 299.792458 / f; // MHz -> meter (c/f)
    let txt;
    if (lambda < 0.01) txt = (lambda * 1000).toFixed(2) + ' mm';
    else if (lambda < 1) txt = (lambda * 100).toFixed(2) + ' cm';
    else if (lambda < 1000) txt = lambda.toFixed(3) + ' m';
    else txt = (lambda / 1000).toFixed(3) + ' km';
    $('wavelength').value = txt;
    let band = '';
    if (f < 30) band = 'HF';
    else if (f < 300) band = 'VHF';
    else if (f < 3000) band = 'UHF';
    else if (f < 30000) band = 'SHF (mikrobølge)';
    else band = 'EHF (millimeter)';
    $('band-info').textContent = `Bånd: ${band}. λ/2 = ${(lambda*100/2).toFixed(1)} cm, λ/4 = ${(lambda*100/4).toFixed(1)} cm.`;
  }
}
$('freq').addEventListener('input', updateFreq);

// dB
function updateDb() {
  const db = +$('db').value;
  $('ratio').value = Math.pow(10, db / 10).toFixed(4);
  $('vratio').value = Math.pow(10, db / 20).toFixed(4);
}
$('db').addEventListener('input', updateDb);

// Lengde — alle koblet til meter
function updateLength(src) {
  const factors = { m: 1, ft: 0.3048, yd: 0.9144, nm: 1852, nmil: 10000 };
  const m = +$(src).value * factors[src];
  for (const id of ['m','ft','yd','nm','nmil']) {
    if (id !== src) $(id).value = (m / factors[id]).toFixed(id === 'nm' || id === 'nmil' ? 4 : 2);
  }
}
['m','ft','yd','nm','nmil'].forEach(id => $(id).addEventListener('input', () => updateLength(id)));

// Vinkel
function updateAngle(src) {
  const deg = src === 'deg' ? +$('deg').value :
              src === 'rad' ? +$('rad').value * 180 / Math.PI :
              src === 'mil' ? +$('mil').value * 360 / 6400 :
              +$('arcmin').value / 60;
  if (src !== 'deg') $('deg').value = deg.toFixed(4);
  if (src !== 'rad') $('rad').value = (deg * Math.PI / 180).toFixed(6);
  if (src !== 'mil') $('mil').value = (deg * 6400 / 360).toFixed(2);
  if (src !== 'arcmin') $('arcmin').value = (deg * 60).toFixed(2);
}
['deg','rad','mil','arcmin'].forEach(id => $(id).addEventListener('input', () => updateAngle(id)));

// Energi
function updateEnergy(src) {
  const j = src === 'j' ? +$('j').value : src === 'kgm' ? +$('kgm').value * 9.80665 : +$('ftlb').value * 1.35582;
  if (src !== 'j') $('j').value = j.toFixed(1);
  if (src !== 'kgm') $('kgm').value = (j / 9.80665).toFixed(2);
  if (src !== 'ftlb') $('ftlb').value = (j / 1.35582).toFixed(1);
}
['j','kgm','ftlb'].forEach(id => $(id).addEventListener('input', () => updateEnergy(id)));

updateFreq(); updateDb();
updateLength('m'); updateAngle('deg'); updateEnergy('j');
</script>
</body>
</html>
