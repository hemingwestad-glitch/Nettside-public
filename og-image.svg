<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="15%" r="80%">
      <stop offset="0%" stop-color="#b8552e" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#f5f1ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="85%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#4a6b7a" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#f5f1ea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#f5f1ea"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Topp-bar: stedsindikator -->
  <g font-family="JetBrains Mono, monospace" fill="#9a9087" font-size="18" letter-spacing="2">
    <text x="80" y="100">63.4305° N · 10.3951° E</text>
    <text x="80" y="128">TRONDHEIM</text>
  </g>

  <!-- Hovedtittel -->
  <text x="80" y="320" font-family="Fraunces, serif" font-size="120" font-weight="300"
        fill="#1a1814" letter-spacing="-0.02em">
    Heming Westad<tspan fill="#b8552e">.</tspan>
  </text>

  <!-- Underline -->
  <text x="80" y="385" font-family="Fraunces, serif" font-size="40" font-weight="400"
        font-style="italic" fill="#3d3833">
    Verktøy som <tspan fill="#b8552e">virker</tspan>.
  </text>

  <!-- Tag-rad -->
  <g font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="2" fill="#6b645b">
    <text x="80" y="510">ROMFART · BALLISTIKK · TIDEVANN · STRØMPRIS · RADIO</text>
  </g>

  <!-- Subtittel -->
  <text x="80" y="560" font-family="Inter Tight, sans-serif" font-size="22"
        fill="#6b645b">Flyingeniør · NTNU · Orbit NTNU programdirektør</text>

  <!-- Dekorativ satellitt-glyph nede til høyre -->
  <g transform="translate(1020, 280)" stroke="#b8552e" fill="none" stroke-width="2">
    <ellipse cx="0" cy="0" rx="120" ry="50" transform="rotate(-20)" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="120" ry="50" transform="rotate(40)" opacity="0.4"/>
    <circle cx="0" cy="0" r="40" fill="#1a1814" stroke="none"/>
    <circle cx="0" cy="0" r="40" stroke="#b8552e" fill="none" stroke-width="1.5"/>
    <path d="M -40 0 A 40 40 0 0 1 40 0 Z" fill="#b8552e"/>
  </g>

  <!-- Domain -->
  <text x="1120" y="585" font-family="JetBrains Mono, monospace" font-size="20"
        text-anchor="end" fill="#9a9087" letter-spacing="1">hemingwestad.no</text>
</svg>
